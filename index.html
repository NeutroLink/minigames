<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MiniGames — a catalogue of curated casual mini-games you can play instantly in the browser."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>MiniGames</title>
    <script>
      // Counterpart to public/404.html: restore the deep link the static host could
      // not serve, before any application code reads the URL.
      const redirect = new URLSearchParams(location.search).get('redirect');
      if (redirect) {
        history.replaceState({}, '', location.pathname.replace(/\/$/, '') + redirect);
      }
    </script>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
